version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: clubplanet_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clubplanet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-clubplanet_prod}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubplanet_admin -d clubplanet_prod"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: clubplanet_server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-clubplanet_admin}:${POSTGRES_PASSWORD:-supersecretpassword}@postgres:5432/${POSTGRES_DB:-clubplanet_prod}?schema=public
      JWT_SECRET: ${JWT_SECRET:-clubplanet_super_jwt_secret_key_2026}
      CLIENT_URL: http://localhost:80
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: clubplanet_client
    restart: always
    ports:
      - "80:80"
    depends_on:
      - server

volumes:
  pgdata:
